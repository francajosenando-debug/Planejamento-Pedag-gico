<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _currentFetch;
              },
              set: function(fn) {
                _currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch property patch exception:', e);
        }
      })();
    </script>
